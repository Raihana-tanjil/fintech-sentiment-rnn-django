<!DOCTYPE html>
<html>
<head>
    <title>Fintech Sentiment Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fintech Sentiment Analysis (SimpleRNN)</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="financial_text">Enter Financial News / Headline:</label><br><br>
            <textarea name="financial_text" placeholder="e.g., Company announces massive revenue surge...">{{ input_text }}</textarea><br>
            <button type="submit">Analyze Sentiment</button>
        </form>

        {% if result %}
        <div class="result">
            <h3>Result:</h3>
            <p><strong>Text:</strong> "{{ result.text }}"</p>
            <p><strong>Prediction:</strong> {{ result}}</p>
            <p><strong>Confidence Score:</strong> {{ score }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
